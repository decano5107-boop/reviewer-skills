name: skill lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile every script
        run: git ls-files -z '*.py' | xargs -0 python3 -m py_compile
      - name: Lint self-test (the linter catches broken fixtures)
        run: python3 scripts/lint_skills.py --self-test
      - name: Lint every skill (frontmatter, description length, referenced files)
        run: python3 scripts/lint_skills.py
